name: KMP CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

  pull_request:
    branches: [main, develop]

concurrency:
  group: kmp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test, Coverage & Build Android Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full git history so Codecov can diff against base commit

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "AUTH_BASE_URL=http://10.0.2.2:8080/api/v1" > local.properties
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >> local.properties
          echo "AGORA_TOKEN=${{ secrets.AGORA_TOKEN }}" >> local.properties

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Run Android Lint
        run: ./gradlew :androidApp:lint --stacktrace

      # ':' prefix targets the root project's aggregate Kover task, so all
      # modules registered via kover(...) in build.gradle.kts get merged into
      # one report. --continue keeps one module's test failure from blocking
      # the aggregate task, so a partial report can still be produced and
      # uploaded via the always()/hashFiles() guard below.
      - name: Run tests & generate coverage
        run: ./gradlew :koverXmlReport --stacktrace --continue

      # Runs even if the previous step failed, but only uploads when a report
      # file actually exists. disable_search avoids picking up any stray
      # coverage files elsewhere in the repo. fail_ci_if_error stays false for
      # now so a transient Codecov-side issue doesn't turn an otherwise-good
      # build red; revisit once upload reliability has been observed.
      - name: Upload coverage to Codecov
        if: always() && hashFiles('build/reports/kover/report.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          disable_search: true
          flags: unit-tests
          name: kmp-unit-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7